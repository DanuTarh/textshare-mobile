<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cross-Device Text Share</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Login Screen -->
  <div id="login-container">
    <h2>Login to Text Share</h2>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit">Connect</button>
    </form>
    <div id="result"></div>
  </div>

  <!-- Text Share App -->
  <div id="app-container" style="display:none;">
    <!-- Top Bar -->
    <div id="header">
      <div id="user-info">
        <span>Logged in as: <strong id="username-display"></strong></span>
      </div>
      <div id="connection-info">
        <span id="status">Disconnected</span>
        <button id="reconnect-btn" style="display:none;">Reconnect</button>
        <button id="disconnect-btn" style="display:none;">Disconnect</button>
        <button id="logout-btn">Logout</button>
      </div>
    </div>

    <!-- Main Content -->
    <div id="main-content">
      <!-- Send Section -->
      <div id="send-section">
        <h3>📤 Send Text</h3>
        <p>Type or paste text here and click Send to share it with your other devices</p>
        <textarea id="send-text" placeholder="Type or paste text here..."></textarea>
        <div id="send-controls">
          <button id="send-btn">Send to Other Devices</button>
          <button id="clear-send-btn">Clear</button>
          <span id="send-chars">0 characters</span>
        </div>
      </div>

      <!-- Receive Section -->
      <div id="receive-section">
        <h3>📥 Received Text</h3>
        <p>Latest text received from your other devices appears here</p>
        <textarea id="receive-text" placeholder="Received text will appear here..." readonly></textarea>
        <div id="receive-controls">
          <button id="copy-received-btn" disabled>Copy This Text</button>
          <button id="clear-received-btn">Clear</button>
          <div id="receive-info">
            <span id="receive-chars">0 characters</span>
            <span id="last-received">No text received yet</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
